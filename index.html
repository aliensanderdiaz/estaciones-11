<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Estaciones Hidrológicas Area Operativa 11</title>
<style>
    #tabla-estaciones {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        border-collapse: separate;
        border-spacing: 0;
        width: 100%;
        overflow: hidden;
        border-radius: 16px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        background: white;
    }

    #tabla-estaciones th {
        background: linear-gradient(135deg, #f78fb3, #c56cf0);
        color: white;
        font-weight: 600;
        padding: 14px;
        text-align: left;
        letter-spacing: 0.5px;
    }

    #tabla-estaciones td {
        padding: 12px 14px;
        border-bottom: 1px solid #f3e5f5;
    }





    #tabla-estaciones tr.automatica {
        background-color: #e8f4ff;
        border-left: 5px solid #74b9ff;
    }

    #tabla-estaciones tr.suspendida {
        background-color: #ffe8ec;
        border-left: 5px solid #ff7675;
    }

    .text-end {
        text-align: right;
        font-weight: 600;
    }

    .llamadas::before {
        content: '📞 ';
    }

    .detalles {
        cursor: pointer;
        color: #c56cf0;
        font-weight: 600;
    }

    .detalles:hover {
        color: #f78fb3;
        text-decoration: underline;
    }
</style>


</head>

<body>
    <h1>Estaciones Hidrológicas Área Operativa - 11</h1>

    <select name="select" id="filtro">
        <option value="todas">Todas</option>
        <option value="activas">Activas</option>
        <option value="suspendidas">Suspendidas</option>
        <!-- <option value="llamadas">Llamadas</option> -->
        <!-- <option value="pluviometricas">Pluviometricas</option> -->
        <!-- <option value="climatologicas">Climatologicas</option> -->
        <option value="automaticas">Automaticas</option>
    </select>

    <input type="text" id="query" placeholder="Buscar...">

    <hr>

    <!-- <p>
        Estaciones totales: 348, Activas: 200, Suspendidas: 148
        <br>
        Pluviometricas: 117*, Climatologicas: 24*
    </p> -->

    <table id="tabla-estaciones"></table>

    <dialog id="favDialog">
        <form method="dialog">
            <p id="info"></p>
            <button>Cerrar</button>
        </form>
    </dialog>

    <script src="./estaciones.js"></script>
    <script src="./logica-estaciones.js"></script>
</body>

</html>
